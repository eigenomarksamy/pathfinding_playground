schema_version: 1

# pathfinding playground's manifest for the eigenomar ecosystem: what this
# repository is and where its documents are. it points at documents and holds
# none of their content. update it in the same change that adds a document,
# CI or a deployment.

id: pathfinding_playground
name: pathfinding playground
description: an interactive laboratory for graph search, where you build a map, pick a solver, watch its decisions step by step and compare how algorithms find a route, with the search in C++ running as WebAssembly in the browser
status: active
tags: [c++, webassembly, pathfinding, graph-search]

links:
  deployment: https://paths.eigenomar.com

documents:
  plan: docs/plan.md
  architecture: docs/architecture.md
  engineering: null
  decisions: null

delivery:
  ci: github-actions               # .github/workflows/ci.yml: native tests with sanitizers, lint, WebAssembly and app checks
  releases: none
  deployment: cloudflare           # Workers static assets, deployed by ci.yml once every check passes
  deploys_on: merge                # every push to main deploys

artifacts:
  diagrams: null
  test_reports: null
  coverage: null
  monitoring: null
